schema-version = 1

[package]
title = "Grandpa's Workshop"
version = "0.1.0"
id = "com.grandpasworkshop.tv"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.webview_4@IWebview_4"

# Amazon In-App Purchasing (IAP) purchase core. Required in every build that sells items
# (debug and release). Source: README of @amazon-devices/keplerscript-appstore-iap-lib (0.24).
[[needs.module]]
id = "/com.amazon.kepler.appstore.iap.purchase.core@IAppstoreIAPPurchaseCoreService"

[[needs.module]]
id = "/com.amazon.kepler.appstore_iap_lib_2@IAppstoreIapLib_12"




[components]
[[components.interactive]]
id = "com.grandpasworkshop.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# Web renderer service for rendering web content
[[wants.service]]
id = "com.amazon.webview.renderer_service"

# If Web App needs keyboard support
[[wants.service]]
id = "com.amazon.inputmethod.service"

# If Web App needs video playback
[[wants.service]]
id = "com.amazon.media.server"

# Required for emitting metrics from video playback
[[wants.service]]
id = "com.amazon.mediametrics.service"

# Required for video playback on stable APIs
[[wants.service]]
id = "com.amazon.mediabuffer.service"
[[wants.service]]
id = "com.amazon.mediatransform.service"

# If Web App needs audio playback
[[wants.service]]
id = "com.amazon.audio.stream"

# Required for audio management features to work in WebView, features like audio focus, volume control 
[[wants.service]]
id = "com.amazon.audio.control"

# To enable accessibility support for your app, we recommend you add the UCC service with the Service Registrar
[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"

# Uncomment below section to enable encrypted media playback (DRM content)
# [[wants.service]]
# id = "com.amazon.drm.key"
# [[wants.service]]
# id = "com.amazon.drm.crypto"
# [[needs.privilege]]
# id = "com.amazon.privilege.security.file-sharing"

# Remote button events for useTVEventHandler (select, menu, play/pause, rewind, fast forward).
# The vegaWebview template does not declare it; the TVEventHandler docs list it as required.
[[wants.service]]
id = "com.amazon.inputd.service"

# Amazon In-App Purchasing (IAP), production path: Appstore IAP core service and its purchase UI.
[[wants.service]]
id = "com.amazon.iap.core.service"
[[wants.module]]
id = "/com.amazon.iap.core@IIAPCoreUI"

# Amazon IAP App Tester (sandbox mode), DEVELOPMENT ONLY. With these two entries a debug build
# talks to the App Tester app instead of the Appstore when /tmp/scratch/com.grandpasworkshop.tv/
# amazon.config.json says {"debug.amazon.sandboxmode": "debug"}. See IAP.md. They are harmless
# in a release build (sandbox mode only works with debug .vpkg files) but can be removed before
# submitting to the Appstore.
[[wants.service]]
id = "com.amazon.iap.tester.service"
[[wants.module]]
id = "/com.amazonappstore.iap.tester@IIAPTesterUI"

# Enable Group-IPC to access media services
[[wants.service]]
id = "com.amazon.gipc.uuid.*"
[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*" 

# You may add other services as needed
